[package]
name = "pi_rpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Transport-free Rust wrapper for the pi coding-agent RPC protocol"
license = "MIT"

[dependencies]
async-trait = { version = "0.1" }
memchr = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
# Floor 0.1.39: event name: syntax (#2699). Never combine name: with
# parent: without raising to 0.1.42 (#2983 fixed that variant).
tracing = { version = "0.1.39", default-features = false, features = ["std"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[package.metadata.pi_rpc]
pi_repo = "https://github.com/earendil-works/pi"
pi_rev = "f1b2e77f5b13b2a199b1052cb79c235451afe7d7"
pi_protocol_version = 8
